<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-10 font-sans">
    
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center">AI Safety Monitor</h1>
        
        <div class="flex gap-2 mb-8 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <input type="text" id="videoUrl" placeholder="Paste YouTube URL here..." 
                   class="flex-grow p-3 rounded-lg bg-slate-900 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="startAnalysis()" 
                    class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-bold transition">Analyze</button>
        </div>

        <div class="text-center">
            <h1 id="status" class="text-xl font-semibold mb-4 text-gray-400">Waiting for a link...</h1>
        </div>
    </div>
    
    <script>
    async function startAnalysis() {
        const url = document.getElementById('videoUrl').value;
        
        if (!url) {
            alert("Please enter a valid YouTube URL");
            return;
        }

        document.getElementById('status').innerText = "Analyzing...";
        document.getElementById('status').className = "text-xl font-semibold mb-4 text-gray-400";

        fetch(`/analyze?url=${encodeURIComponent(url)}`)
            .then(response => response.json())
            .then(data => {
                updateUI(data.status);
            })
            .catch(err => {
                console.error("Analysis error:", err);
                document.getElementById('status').innerText = "Error analyzing video.";
            });
    }

    function updateUI(status) {
        const statusElement = document.getElementById('status');
    
        if(status === "SAFE") {
            statusElement.innerText = "Safe: Video is Kid-Friendly!";
            statusElement.className = "text-green-400 text-2xl font-bold mb-4";
        } else {
            statusElement.innerText = "Blocked: This video is NOT Kid-Friendly!";
            statusElement.className = "text-red-400 text-2xl font-bold mb-4";
        }
        feedback.classList.remove('hidden');
    }

    function submitFeedback(type) {
        const feedback = document.getElementById('feedback-selection');
        feedback.innerHTML = `<p class="text-greel-400 font-bold p-4">Feedback recorded. Thank you!</p>`;
        console.log("User feedback: " + type);
    }
    </script>
</body>
</html>
